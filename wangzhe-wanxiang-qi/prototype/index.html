<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王者万象棋 · 可玩原型</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>王者万象棋 <span class="subtitle">King's Myriad Chess · 可玩原型</span></h1>
    <div class="legend">
      🛡️坦克 ⚔️战士 🗡️刺客 🔮法师 🏹射手 ｜ ⭐野区Buff 🌿草丛 💎水晶基地
    </div>
  </header>

  <main class="layout">
    <section class="board-area">
      <div class="base-hp base-hp-red">
        🔴 红方水晶 <b id="redBaseNum">50/50</b>
        <div class="hpbar"><span id="redBaseHp"></span></div>
      </div>
      <div id="board" class="board"></div>
      <div class="base-hp base-hp-blue">
        🔵 蓝方水晶 <b id="blueBaseNum">50/50</b>
        <div class="hpbar"><span id="blueBaseHp"></span></div>
      </div>
    </section>

    <aside class="side-panel">
      <div class="turn-box">
        <div class="turn-line">回合 <b id="turnNo">1</b> ｜ 当前行动方：<b id="sideName">蓝方（你）</b></div>
        <div class="energy-line">
          <span class="e-blue">🔵 蓝方能量 <b id="blueEnergy">0</b>/10</span>
          <span class="e-red">🔴 红方能量 <b id="redEnergy">0</b>/10</span>
        </div>
        <div class="btns">
          <button id="skillBtn" disabled>释放技能</button>
          <button id="cancelBtn" disabled>取消选择</button>
          <button id="endTurnBtn" class="primary">结束回合 ▶</button>
          <button id="restartBtn">重开</button>
        </div>
        <div id="hint" class="hint">点击你的英雄（蓝方）以选中，绿色=可移动，红色=可攻击。</div>
      </div>

      <div class="selected-box">
        <h3>选中英雄</h3>
        <div id="selInfo" class="sel-info">未选中</div>
      </div>

      <div class="log-box">
        <h3>对局日志</h3>
        <div id="log" class="log"></div>
      </div>
    </aside>
  </main>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="overlayTitle">胜利！</h2>
      <p id="overlayText"></p>
      <button id="overlayBtn" class="primary">再来一局</button>
    </div>
  </div>

  <script src="heroes.js"></script>
  <script src="game.js"></script>
</body>
</html>
